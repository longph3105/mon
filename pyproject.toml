#
# Installation:
#   uv sync                 # core (headless OpenCV)
#   uv sync --extra gui     # + matplotlib, PySide6 for display
#
# References:
#   - pyproject.toml: https://packaging.python.org/en/latest/
#   - uv            : https://docs.astral.sh/uv/

[project]
name            = "mon"
version         = "3.0.0.dev0"
description     = "A Python + PyTorch library for computer-vision research."
license         = "MIT"
license-files   = ["LICENSE"]
readme          = "README.md"
requires-python = ">=3.13,!=3.14.1"        # torchvision excludes 3.14.1.
authors         = [{ name = "Long H. Pham", email = "longpham3105@gmail.com" }]
keywords        = ["computer vision", "deep learning", "research"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Add a dependency only when the module that needs it is ported; note why next to it.
dependencies    = [
    # --- Core ---
    "omegaconf>=2.3,<2.5",              # Configs: interpolation, typed schemas, CLI overrides. Allows 2.3.x for hydra-core.
    "pyyaml>=6.0.3",                    # YAML parser and emitter.
    "rich>=15.0",                       # Rich terminal output: tables, progress, tracebacks.
    "tqdm>=4.70",                       # Not imported by mon: gives torch.hub downloads a real progress bar.
    # --- Scientific Computing ---
    "numpy>=2.5",                       # Array computing.
    # --- Deep Learning ---
    "torch>=2.15",                      # Tensor library and autograd.
    "torchvision>=0.29",                # Vision datasets, transforms, and models.
    "torchdiffeq>=0.2.5",               # ODE solvers with adjoint backprop (CLODE). MIT.
    # --- Computer Vision ---
    # Headless only: `opencv-python` would overwrite the same `cv2/` package, so don't add it.
    # No cv2.imshow on Linux; show images through the `gui` extra instead.
    "opencv-python-headless>=5.0",      # Image and video I/O and processing.
]

[project.optional-dependencies]
gui             = [
    "matplotlib>=3.11",                 # Image and figure display.
    # Essentials = QtCore/Gui/Widgets/OpenGL/...; use full `PySide6` (+WebEngine, ~1.3 GB) only if needed.
    "PySide6-Essentials>=6.12",         # Official Qt bindings (LGPL): GUI apps and matplotlib's QtAgg backend.
]

[project.scripts]
mon = "mon.runners.cli:main"          # `mon predict [config.yaml] key=value ...`

[project.urls]
Homepage        = "https://github.com/longph3105/mon"
Documentation   = "https://github.com/longph3105/mon/tree/main/docs"
Repository      = "https://github.com/longph3105/mon.git"
Issues          = "https://github.com/longph3105/mon/issues"

# Development-only; installed by `uv sync` (default group), not shipped with the package.
[dependency-groups]
dev             = [
    "mypy>=2.4",                        # Static type checker.
    "pytest>=9.2",                      # Test runner.
    "scikit-image>=0.26",               # Test reference only (TV denoising parity).
    "types-PyYAML>=6.0.12",             # Type stubs for pyyaml.
]

# --- pytest ---
[tool.pytest]
testpaths       = ["tests", "src/mon"]
addopts         = ["--doctest-modules", "--strict-markers", "--import-mode=importlib", "-m", "not full"]
markers         = [
    "slow: long-running test (deselect with -m 'not slow')",
    "gpu: needs CUDA or MPS (deselect with -m 'not gpu')",
    "full: regression on a full dataset against published numbers; off by default (run with -m full)",
]

# --- mypy ---
[tool.mypy]
python_version  = "3.13"
files           = ["src/mon"]
strict          = true

# Third-party packages without type information (no py.typed / stubs).
[[tool.mypy.overrides]]
module                 = ["torchdiffeq", "torchdiffeq.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

# --- uv ---
[tool.uv]
# Resolve a lock that works on the dev Mac and on Linux GPU machines.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires        = ["uv_build>=0.13.7,<0.14"]
build-backend   = "uv_build"
